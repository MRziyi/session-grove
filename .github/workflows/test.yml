name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suite: all }
          - { os: macos-latest, suite: all }
          - { os: windows-latest, suite: core }
          - { os: windows-latest, suite: native }
          - { os: windows-latest, suite: git-1 }
          - { os: windows-latest, suite: git-2 }
          - { os: windows-latest, suite: browser }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-test.js --suite=${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.os }}-${{ matrix.suite }}
          path: test-results/ci/*.json
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Session Grove $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
