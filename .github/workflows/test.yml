name: Tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run full cross-platform regression coverage
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suite: all }
          - { os: ubuntu-latest, suite: browser }
          - os: macos-latest
            suite: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.full == true || contains(github.event.head_commit.message, '[full-ci]')) && 'all' || 'platform' }}
          - os: windows-latest
            suite: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.full == true || contains(github.event.head_commit.message, '[full-ci]')) && 'unit' || 'platform' }}
          - { os: windows-latest, suite: git }
          - os: windows-latest
            suite: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.full == true || contains(github.event.head_commit.message, '[full-ci]')) && 'browser' || 'browser-compat' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-test.js --suite=${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.os }}-${{ matrix.suite }}
          path: test-results/ci/*.json
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Session Grove $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
