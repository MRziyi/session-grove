<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
  <title>Session Grove</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Session Grove"><span class="brand-mark">⑂</span><span>Session<br><strong>Grove</strong></span></a>
    <div class="workspace-label"><span id="device-name"></span><span id="mode"></span></div>
    <div class="section-label"><span data-t="Local Active"></span><span id="active-count">0</span></div>
    <button class="side-action" id="local-home"><span>◉</span><span data-t="All local sessions"></span></button>
    <nav id="active-list" class="active-list" aria-label="Local active sessions"></nav>
    <div class="section-label cloud-section"><span data-t="Cloud projects"></span><button id="add-project" aria-label="New project">＋</button></div>
    <div id="cloud-state" class="cloud-status"></div>
    <nav id="projects" aria-label="Projects"></nav>
    <div class="sidebar-bottom">
      <button id="sync-settings">⇅ <span data-t="Sync & settings"></span></button>
      <div class="language-control"><label for="language" data-t="Language">Language</label><select id="language"><option value="en">English</option><option value="zh">中文</option></select></div>
      <small data-t="Local first. Yours to keep."></small>
    </div>
  </aside>
  <main>
    <header><div class="breadcrumb"><button id="breadcrumb-home"></button><span id="breadcrumb-tail"></span></div><div class="header-actions"><span id="capture-state" data-t="Saved locally"></span><button id="collect" class="quiet">↻ <span data-t="Refresh"></span></button><button id="review-active" class="button small-button"><span data-t="Active set"></span><span id="pending-count">0</span></button></div></header>
    <div class="project-heading"><div><div class="eyebrow" id="scope-label"></div><h1 id="project-name"></h1><p id="project-description"></p></div><div class="heading-actions"><button id="move-item" class="button" hidden data-t="Move / group"></button><button id="new-branch" class="button primary">＋ <span data-t="New session"></span></button></div></div>
    <div class="workspace-toolbar"><div class="view-tabs"><button id="collection-back" hidden data-t="Back to collection"></button><span id="view-label"></span></div><div class="filters"><label class="search"><span>⌕</span><input id="search" data-placeholder="Search sessions…" aria-label="Search sessions"></label><label class="archive-filter"><input id="show-archived" type="checkbox"><span data-t="Show archived"></span></label></div></div>
    <div class="workspace">
      <section id="graph-panel" aria-label="Project collection"><div id="graph-viewport"><div id="graph-world"></div></div><div class="graph-footer" id="graph-footer" hidden><span><i class="legend-dot"></i> <span data-t="Active"></span><span class="legend-line"></span><span data-t="Context inheritance"></span></span><div><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-reset" data-t="Fit"></button></div></div></section>
      <aside id="inspector" aria-label="Logical node details" hidden></aside>
    </div>
    <footer><span id="project-stats"></span><span>SESSION GROVE <span class="version">0.2.0</span></span></footer>
  </main>
  <dialog id="dialog"><form id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" aria-label="Close">×</button></div><div id="dialog-content"></div><p id="dialog-error" role="alert"></p><div id="dialog-actions"><button type="button" id="dialog-cancel" class="button" data-t="Cancel"></button><button type="submit" id="dialog-submit" class="button primary" data-t="Save"></button></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
