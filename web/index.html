<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
  <title>Session Grove</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="banner"><a class="brand" href="/">Session Grove</a><span id="demo-badge"></span><div class="banner-actions"><div id="sync-control" class="sync-control"><div id="sync-details"><span id="cloud-status" role="status"></span><span id="sync-substatus"></span><button id="smart-status" type="button" hidden></button><details id="sync-error" hidden><summary></summary><div></div></details></div><div class="sync-buttons"><button id="sync" type="button"></button><div id="push-zone" tabindex="0"><button id="upload" type="button"></button><div id="pending-uploads" class="sync-panel" popover="manual" hidden></div></div></div></div><button id="collect"></button><button id="settings"></button></div></header>
  <div id="layout" class="layout">
    <aside class="navigation"><button id="toggle-navigation" class="pane-toggle" title="Collapse projects">‹</button><nav id="navigation" aria-label="Navigation"></nav><div id="sync-setup" class="sync-setup" hidden><p></p><button type="button"></button></div><footer class="nav-footer"><button id="about">About</button><button id="information" aria-label="Information">ⓘ</button><button id="language-toggle" type="button" aria-label="Language">En</button></footer></aside>
    <aside id="session-rail" class="session-rail" hidden><button id="toggle-rail" class="pane-toggle">‹</button><div id="rail-content"></div></aside>
    <main id="main"><section id="list-page"><h1 id="list-title"></h1><div class="toolbar"><span id="list-count"></span><label class="search"><span id="search-icon"></span><input id="search" type="search"></label><div id="list-actions" class="actions"></div></div><div id="active-notice" class="native-notice" hidden></div><div id="session-list"></div></section>
    <section id="detail-page" hidden><div class="detail-heading"><button id="back"></button><h1 id="session-title"></h1><span id="session-meta"></span><button id="source"></button></div><div class="toolbar"><span id="detail-count"></span><div id="detail-actions" class="actions"></div></div><div id="editor" class="editor"><section class="transcript-panel"><div class="panel-heading"><h2 id="transcripts-title"></h2><select id="branch-picker" aria-label="Session branch"></select></div><div id="range-hint"></div><div id="transcripts" tabindex="0"></div></section><div id="ribbon-lane" role="separator" aria-label="Resize transcript and graph" aria-orientation="vertical" tabindex="0"><span class="divider-grip" aria-hidden="true"></span><svg id="ribbons"></svg></div><section class="graph-panel"><div class="panel-heading"><h2 id="graph-title"></h2><div class="graph-controls"><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="graph-fit">Fit tree</button><button id="graph-reset">Reset view</button></div></div><div id="graph-scroll"><div id="graph"></div></div></section></div></section></main>
  </div>
  <dialog id="dialog"><form id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" aria-label="Close">×</button></div><div id="dialog-content"></div><p id="dialog-error" role="alert"></p><div class="dialog-actions"><button type="button" id="dialog-cancel"></button><button type="submit" id="dialog-submit" class="primary"></button></div></form></dialog>

  <aside id="trash-progress" popover="manual" role="status" aria-live="polite" hidden></aside><div id="toast" role="status" aria-live="polite"></div><script type="module" src="/app.js"></script>
</body>
</html>
